# WeeChat Radio default config
# Generated by `wcr setup`. Advanced knobs live here, not in the wizard.

callsign = "N0CALL"
grid = "IO91wm"
mode = "internet-radio"

[irc]
bind = "127.0.0.1:6667"

[modem]
host = "127.0.0.1"
kiss_port = 8001
control_port = 8073
manage = true
binary = "modem73"
ptt = "none"          # vox | digirig | cm108 | rigctl | none
preset = "vhf-fm"     # vhf-fm | hf-good | hf-poor | hf-weak | vox-safe
com_port = ""
com_line = "rts"
vox_lead_ms = 500
vox_tail_ms = 150
cm108_gpio = 3
rigctl = "127.0.0.1:4532"

[hub]
url = "wss://hub.weechatradio.com/ws"
peers = []

[telemetry]
url = "https://hub.weechatradio.com/api/v1/report"
interval_secs = 30

[gateway]
rf_egress = true
third_party = "deny"

[store]
max_age_hours = 72
max_msgs = 10000

[group]
history_max_msgs = 50
history_max_age_hours = 24

[lan]
discovery = true
port = 7373

[ui]
theme = "tron"        # tron | hacker | terminal
unicode = true
activity_panel = true
bell = false
boot = true

[status]
bind = "127.0.0.1:8074"

[relay]
default_ttl = 3
max_message_bytes = 300

[rig]
enabled = false
host = "127.0.0.1:4532"
