name: deploy
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ghcr.io/thaum-labs/wcr:latest
  droplet:
    needs: image
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deploy over ssh
        uses: appleboy/ssh-action@v1
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: RESEND_API_KEY,RESEND_WEBHOOK_SECRET
          script: |
            set -eu
            cd /opt/wcr
            git fetch origin
            git reset --hard origin/main
            umask 077
            touch .env
            tmp=$(mktemp)
            grep -v -E '^(RESEND_API_KEY|RESEND_WEBHOOK_SECRET)=' .env > "$tmp" || true
            if [ -n "${RESEND_API_KEY:-}" ]; then printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY" >> "$tmp"; fi
            if [ -n "${RESEND_WEBHOOK_SECRET:-}" ]; then printf 'RESEND_WEBHOOK_SECRET=%s\n' "$RESEND_WEBHOOK_SECRET" >> "$tmp"; fi
            mv "$tmp" .env
            chmod 600 .env
            docker compose -f deploy/docker-compose.yml pull
            docker compose -f deploy/docker-compose.yml up -d --no-build
