name: sync-install-sha256
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.14)
        required: true
        type: string
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: download checksum sidecars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/wcr-sha
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern '*.sha256' --dir /tmp/wcr-sha
          ls -la /tmp/wcr-sha
      - name: patch install manifests
        run: python scripts/sync_install_sha256.py /tmp/wcr-sha "${{ inputs.tag }}"
      - name: commit manifest hashes
        run: |
          set -euo pipefail
          if git diff --quiet install/; then
            echo "No manifest changes"
            exit 0
          fi
          git config user.name "thaum-labs"
          git config user.email "73592328+thaum-labs@users.noreply.github.com"
          git add install/
          git commit -m "Sync install manifest SHA256 for ${{ inputs.tag }}."
          git push origin HEAD:main
