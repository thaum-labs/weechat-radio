name: release
on:
  push:
    tags: ["v*"]
  # Release button. Give a version like v0.1.111, or v1.0.0-rc1 for a
  # release candidate (published as a GitHub pre-release, install manifests
  # left on the last final release). If the tag does not exist
  # yet, it is created on main (the version must match Cargo.toml), then the
  # release is built and published. If the tag already exists, the assets are
  # rebuilt and uploaded again (repair).
  workflow_dispatch:
    inputs:
      tag:
        description: Release version, e.g. v0.1.111 (tagged on main if new)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: create the tag on main (release button only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "tag must look like v0.1.111 or v1.0.0-rc1"; exit 1 ;; esac
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists, rebuilding its assets"
            exit 0
          fi
          WANT="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [ "v$WANT" != "$TAG" ]; then
            echo "Cargo.toml on main says $WANT, not ${TAG#v}. Merge the version bump first."
            exit 1
          fi
          git config user.name "thaum-labs"
          git config user.email "73592328+thaum-labs@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          # A tag pushed with GITHUB_TOKEN does not start this workflow again.
          git push origin "refs/tags/$TAG"
      - name: write notes from git log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          git fetch --tags --force
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          # versionsort.suffix sorts v1.0.0-rc1 before v1.0.0.
          PREV="$(git -c versionsort.suffix=-rc tag --list 'v*' --sort=-v:refname | awk -v t="$TAG" '$0==t {getline; print; exit}')"
          {
            git log -1 --format='%s.' "$TAG"
            echo
            if [ -n "$PREV" ]; then
              git log --reverse --format='- %s' "${PREV}..${TAG}"
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            else
              git log --reverse --format='- %s' "$TAG"
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
            fi
          } > release-notes.md
          cat release-notes.md
          PRE=""
          case "$TAG" in *-rc*) PRE="--prerelease" ;; esac
          gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --verify-tag --draft $PRE --title "$TAG" --notes-file release-notes.md
  # modem73 with our network-audio patch, built from source (modem73.yml).
  modem73:
    uses: ./.github/workflows/modem73.yml
  build:
    needs: [notes, modem73]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not ubuntu-latest: binaries need the glibc of the build
          # image, and ubuntu-latest moved to 26.04 (glibc 2.43) in v0.1.113.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: wcr-linux-x86_64.tar.gz
            modem_asset: modem73-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: wcr-linux-aarch64.tar.gz
            modem_asset: modem73-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: wcr-macos-x86_64.tar.gz
            modem_asset: modem73-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: wcr-macos-aarch64.tar.gz
            modem_asset: modem73-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: wcr-windows-x86_64.zip
            modem_asset: modem73-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: linux windowing libs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libasound2-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: fetch modem73
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.modem_asset }}
      - name: bundle modem73 linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${{ matrix.modem_asset }}" dist/modem73
          chmod +x dist/modem73 "${{ matrix.modem_asset }}"
          cp third_party/modem73/NOTICE dist/MODEM73-NOTICE
      - name: bundle modem73 macos
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -xzf "${{ matrix.modem_asset }}" -C dist
          test -s dist/modem73
          test -n "$(ls -A dist/libs)"
          cp third_party/modem73/NOTICE dist/MODEM73-NOTICE
      - name: bundle modem73 windows
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          Copy-Item ${{ matrix.modem_asset }} dist\modem73.exe
          Copy-Item third_party\modem73\NOTICE dist\MODEM73-NOTICE
      # The fallback download in this wcr build (crates/wcr/src/modem/ensure.rs)
      # fetches modem73 from this release's own tag and checks it against the
      # hash of the exact asset bundled here.
      - name: pin modem73 hash into wcr
        shell: bash
        run: |
          set -euo pipefail
          ASSET="${{ matrix.modem_asset }}"
          test -s "$ASSET"
          if command -v sha256sum >/dev/null; then
            SUM="$(sha256sum "$ASSET" | awk '{print $1}')"
          else
            SUM="$(shasum -a 256 "$ASSET" | awk '{print $1}')"
          fi
          echo "$ASSET sha256 $SUM"
          echo "WCR_MODEM73_SHA256=$SUM" >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }} -p wcr
      - name: refuse linux binaries that need glibc newer than 2.39
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for BIN in wcr wcr-gui; do
            F="target/${{ matrix.target }}/release/$BIN"
            [ -f "$F" ] || continue
            NEED="$(objdump -T "$F" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
            echo "$BIN needs glibc $NEED"
            if [ "$(printf '%s\n2.39\n' "$NEED" | sort -V | tail -n 1)" != "2.39" ]; then
              echo "::error::$BIN needs glibc $NEED; Ubuntu 24.04 and Debian 13 users could not start it (max 2.39)"
              exit 1
            fi
          done
      - name: quickstart pdf
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          pip install fpdf2
          python docs/build_quickstart_pdf.py
      - name: pack unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/wcr dist/
          cp target/${{ matrix.target }}/release/wcr-gui dist/ || true
          cp crates/wcr/assets/icon.png dist/weechat-radio.png
          cp README.md LICENSE NOTICE docs/QUICKSTART.md docs/QUICKSTART.txt dist/
          if [ -f docs/QUICKSTART.pdf ]; then cp docs/QUICKSTART.pdf dist/; fi
          cp weechat/radio.py dist/radio.py
          cp weechat/LICENSE dist/WEECHAT-SCRIPT-LICENSE
          tar -czf ${{ matrix.asset }} -C dist .
      - name: asset checksum
        if: runner.os != 'Windows'
        run: sha256sum "${{ matrix.asset }}" | awk '{print $1}' > "${{ matrix.asset }}.sha256"
      - name: pack windows
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path dist\modem73.exe)) { throw "refusing to ship a Windows zip without modem73.exe" }
          copy target\${{ matrix.target }}\release\wcr.exe dist\
          copy target\${{ matrix.target }}\release\wcr-gui.exe dist\
          copy crates\wcr\assets\icon.png dist\weechat-radio.png
          copy README.md,LICENSE,NOTICE,docs\QUICKSTART.md,docs\QUICKSTART.txt dist\
          copy weechat\radio.py dist\radio.py
          copy weechat\LICENSE dist\WEECHAT-SCRIPT-LICENSE
          if (Test-Path weechat\minttyrc) { copy weechat\minttyrc dist\minttyrc }
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.asset }} -Force
      - name: asset checksum windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $h = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}").Hash.ToLower()
          Set-Content -Path "${{ matrix.asset }}.sha256" -Value $h -NoNewline
      - name: refuse unix archive without modem73
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          set -euo pipefail
          tar -tzf "${{ matrix.asset }}" | grep -E '(^|/)modem73$'
          if [ "${{ runner.os }}" = "macOS" ]; then
            tar -tzf "${{ matrix.asset }}" | grep -E 'libs/libhamlib'
          fi
      - name: Upload release assets
        uses: nick-fields/retry@v3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          timeout_minutes: 20
          max_attempts: 5
          retry_wait_seconds: 30
          shell: bash
          command: |
            set -euo pipefail
            gh release upload "${RELEASE_TAG}" "${{ matrix.asset }}" --clobber
            if [ -f "${{ matrix.asset }}.sha256" ]; then
              gh release upload "${RELEASE_TAG}" "${{ matrix.asset }}.sha256" --clobber
            fi
            if [ -n "${{ matrix.modem_asset }}" ] && [ -e "${{ matrix.modem_asset }}" ]; then
              gh release upload "${RELEASE_TAG}" "${{ matrix.modem_asset }}" --clobber
            fi
  publish:
    # Publish only when every platform built and uploaded. If one build fails
    # or never gets a runner, the release stays a draft and "latest" keeps
    # pointing at the previous complete release. Re-run the failed jobs to
    # finish it.
    needs: [notes, build]
    if: ${{ !cancelled() && needs.notes.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: publish release after assets upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
      - name: check every asset is on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          COUNT="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')"
          echo "${RELEASE_TAG} has ${COUNT} assets"
          test "$COUNT" -ge 15
  sync_install_manifests:
    needs: [build, publish]
    # Homebrew, Scoop and winget stay on the last final release during RCs.
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-rc') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: download checksum sidecars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/wcr-sha
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern '*.sha256' --dir /tmp/wcr-sha
          ls -la /tmp/wcr-sha
      - name: patch install manifests
        run: python scripts/sync_install_sha256.py /tmp/wcr-sha "${RELEASE_TAG}"
      - name: commit manifest hashes
        run: |
          set -euo pipefail
          if git diff --quiet install/; then
            echo "No manifest changes"
            exit 0
          fi
          git config user.name "thaum-labs"
          git config user.email "73592328+thaum-labs@users.noreply.github.com"
          git add install/
          git commit -m "Sync install manifest SHA256 for ${RELEASE_TAG}."
          git push origin HEAD:main
