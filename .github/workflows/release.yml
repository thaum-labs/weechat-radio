name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: wcr-linux-x86_64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: wcr-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: wcr-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: wcr-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p wcr
      - name: pack unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/wcr dist/
          cp README.md LICENSE NOTICE docs/QUICKSTART.md dist/
          tar -czf ${{ matrix.asset }} -C dist .
      - name: pack windows
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\wcr.exe dist\
          copy README.md,LICENSE,NOTICE dist\
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
