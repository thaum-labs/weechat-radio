name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload assets for
        required: true
        type: string
permissions:
  contents: write
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
jobs:
  notes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: write notes from git log
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PREV="$(git tag --list 'v*' --sort=-v:refname | awk -v t="$TAG" '$0==t {getline; print; exit}')"
          {
            git log -1 --format='%s.' "$TAG"
            echo
            if [ -n "$PREV" ]; then
              git log --reverse --format='- %s' "${PREV}..${TAG}"
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            else
              git log --reverse --format='- %s' "$TAG"
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
            fi
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2.2.2
        with:
          body_path: release-notes.md
          generate_release_notes: false
          draft: true
  build:
    needs: notes
    if: ${{ !failure() && !cancelled() && (needs.notes.result == 'success' || needs.notes.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: wcr-linux-x86_64.tar.gz
            modem_asset: modem73-linux-x86_64
            modem_deb: modem73_*_ubuntu-24.04_amd64.deb
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: wcr-linux-aarch64.tar.gz
            modem_asset: modem73-linux-aarch64
            modem_deb: modem73_*_ubuntu-24.04_arm64.deb
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: wcr-macos-x86_64.tar.gz
            modem_asset: modem73-macos-x86_64.tar.gz
            modem_deb: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: wcr-macos-aarch64.tar.gz
            modem_asset: modem73-macos-aarch64.tar.gz
            modem_deb: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: wcr-windows-x86_64.zip
            modem_asset: modem73-windows-x86_64.exe
            modem_deb: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: linux windowing libs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libasound2-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p wcr
      - name: bundle modem73 linux
        if: runner.os == 'Linux' && matrix.modem_deb != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download --repo RFnexus/modem73 --pattern "${{ matrix.modem_deb }}" --dir /tmp/m73
          dpkg-deb -x /tmp/m73/*.deb /tmp/m73/unpack
          find /tmp/m73/unpack -type f -name modem73 -exec cp {} dist/modem73 \;
          test -s dist/modem73
          chmod +x dist/modem73
          cp dist/modem73 "${{ matrix.modem_asset }}"
          cp third_party/modem73/NOTICE dist/MODEM73-NOTICE
      - name: bundle modem73 macos
        if: runner.os == 'macOS' && matrix.modem_asset != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist/libs /tmp/m73/out
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) PATTERN="modem73_*_macos-arm64.tar.gz" ;;
            *) PATTERN="modem73_*_macos-x86_64.tar.gz" ;;
          esac
          gh release download --repo RFnexus/modem73 --pattern "$PATTERN" --dir /tmp/m73
          tar -xzf /tmp/m73/modem73_*_macos*.tar.gz -C /tmp/m73/out
          find /tmp/m73/out -type f -name modem73 -exec cp {} dist/modem73 \;
          test -s dist/modem73
          chmod +x dist/modem73
          LIBS="$(find /tmp/m73/out -type d -name libs | head -n 1)"
          test -n "$LIBS"
          cp -R "$LIBS"/. dist/libs/
          test -n "$(ls -A dist/libs)"
          tar -czf "${{ matrix.modem_asset }}" -C dist modem73 libs
          cp third_party/modem73/NOTICE dist/MODEM73-NOTICE
          if [ -f /tmp/m73/out/modem73/LICENSE ]; then cp /tmp/m73/out/modem73/LICENSE dist/MODEM73-LICENSE; fi
      - name: quickstart pdf
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          pip install fpdf2
          python docs/build_quickstart_pdf.py
      - name: pack unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/wcr dist/
          cp target/${{ matrix.target }}/release/wcr-gui dist/ || true
          cp crates/wcr/assets/icon.png dist/weechat-radio.png
          cp README.md LICENSE NOTICE docs/QUICKSTART.md docs/QUICKSTART.txt dist/
          if [ -f docs/QUICKSTART.pdf ]; then cp docs/QUICKSTART.pdf dist/; fi
          cp weechat/radio.py dist/radio.py
          cp weechat/LICENSE dist/WEECHAT-SCRIPT-LICENSE
          tar -czf ${{ matrix.asset }} -C dist .
      - name: asset checksum
        if: runner.os != 'Windows'
        run: sha256sum "${{ matrix.asset }}" | awk '{print $1}' > "${{ matrix.asset }}.sha256"
      - name: bundle modem73 windows
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dist
          gh release download --repo RFnexus/modem73-win --pattern "modem73_*_win64.zip" --dir m73
          Expand-Archive -Path (Get-ChildItem m73\modem73_*_win64.zip).FullName -DestinationPath m73\out -Force
          if (-not (Test-Path m73\out\modem73.exe)) { throw "modem73.exe missing from upstream zip" }
          Copy-Item m73\out\modem73.exe dist\modem73.exe
          Copy-Item m73\out\modem73.exe ${{ matrix.modem_asset }}
          if (Test-Path m73\out\LICENSE) { Copy-Item m73\out\LICENSE dist\MODEM73-LICENSE }
          Copy-Item third_party\modem73\NOTICE dist\MODEM73-NOTICE
      - name: pack windows
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path dist\modem73.exe)) { throw "refusing to ship a Windows zip without modem73.exe" }
          copy target\${{ matrix.target }}\release\wcr.exe dist\
          copy target\${{ matrix.target }}\release\wcr-gui.exe dist\
          copy crates\wcr\assets\icon.png dist\weechat-radio.png
          copy README.md,LICENSE,NOTICE,docs\QUICKSTART.md,docs\QUICKSTART.txt dist\
          copy weechat\radio.py dist\radio.py
          copy weechat\LICENSE dist\WEECHAT-SCRIPT-LICENSE
          if (Test-Path weechat\minttyrc) { copy weechat\minttyrc dist\minttyrc }
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.asset }} -Force
      - name: asset checksum windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $h = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}").Hash.ToLower()
          Set-Content -Path "${{ matrix.asset }}.sha256" -Value $h -NoNewline
      - name: refuse unix archive without modem73
        if: (runner.os == 'Linux' || runner.os == 'macOS') && matrix.modem_asset != ''
        run: |
          set -euo pipefail
          tar -tzf "${{ matrix.asset }}" | grep -E '(^|/)modem73$'
          if [ "${{ runner.os }}" = "macOS" ]; then
            tar -tzf "${{ matrix.asset }}" | grep -E 'libs/libhamlib'
          fi
      - name: Upload release assets
        uses: nick-fields/retry@v3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          timeout_minutes: 20
          max_attempts: 5
          retry_wait_seconds: 30
          shell: bash
          command: |
            set -euo pipefail
            gh release upload "${RELEASE_TAG}" "${{ matrix.asset }}" --clobber
            if [ -f "${{ matrix.asset }}.sha256" ]; then
              gh release upload "${RELEASE_TAG}" "${{ matrix.asset }}.sha256" --clobber
            fi
            if [ -n "${{ matrix.modem_asset }}" ] && [ -e "${{ matrix.modem_asset }}" ]; then
              gh release upload "${RELEASE_TAG}" "${{ matrix.modem_asset }}" --clobber
            fi
  publish:
    needs: [notes, build]
    if: ${{ !cancelled() && (needs.notes.result == 'success' || needs.notes.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: publish release after assets upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          count="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets -q '.assets | length')"
          if [ "${count}" -eq 0 ]; then
            echo "No assets on ${RELEASE_TAG}; leaving draft release unpublished."
            exit 0
          fi
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
  sync_install_manifests:
    needs: [build, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: download checksum sidecars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/wcr-sha
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern '*.sha256' --dir /tmp/wcr-sha
          ls -la /tmp/wcr-sha
      - name: patch install manifests
        run: python scripts/sync_install_sha256.py /tmp/wcr-sha
      - name: commit manifest hashes
        run: |
          set -euo pipefail
          if git diff --quiet install/; then
            echo "No manifest changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install/
          git commit -m "Sync install manifest SHA256 for ${GITHUB_REF_NAME}."
          git push origin HEAD:main
