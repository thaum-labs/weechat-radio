<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeeChat Radio station</title>
<link rel="stylesheet" href="/station.css">
</head>
<body class="login">
<main>
  <h1 class="brand-line"><svg class="brand-mark" viewBox="0 0 64 60" fill="none" aria-hidden="true" focusable="false"><path d="M8 20 L20 30 L8 40" stroke="#d8d0e8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="25" y="36" width="15" height="5" rx="1" fill="#7d9bff"/><path d="M40 29 A7 7 0 0 1 47 36" stroke="#7d9bff" stroke-width="4" stroke-linecap="round"/><path d="M40 23 A13 13 0 0 1 53 36" stroke="#7d9bff" stroke-width="4" stroke-linecap="round" opacity="0.7"/><path d="M40 17 A19 19 0 0 1 59 36" stroke="#7d9bff" stroke-width="4" stroke-linecap="round" opacity="0.4"/></svg><span class="brand-word"><span class="brand-weechat">weechat</span><span class="brand-radio">radio</span></span></h1>
  <p class="dim">This station's web page. Enter the password set with <code>wcr web password</code>.</p>
  <form method="post" action="/login">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Log in</button>
    <p class="warn" role="alert"><!--NOTE--></p>
  </form>
</main>
</body>
</html>
