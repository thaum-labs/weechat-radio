[package]
name = "wcr"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "WeeChat Radio node daemon, hub, and TUI — HF/VHF chat with store-and-forward"
readme = "../../README.md"
default-run = "wcr"

[[bin]]
name = "wcr"
path = "src/main.rs"

[[bin]]
name = "wcr-gui"
path = "src/bin/wcr_gui.rs"
required-features = ["desktop"]

[dependencies]
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
crc.workspace = true
hex.workspace = true
base64.workspace = true
chrono.workspace = true
rand.workspace = true
bytes.workspace = true
parking_lot.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
axum.workspace = true
tower-http.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
directories.workspace = true
dialoguer.workspace = true
console.workspace = true
ratatui.workspace = true
crossterm.workspace = true
mdns-sd.workspace = true
governor.workspace = true
sha2.workspace = true
hmac.workspace = true
zeroize.workspace = true
hostname.workspace = true
notify-rust = "4.11"
eframe = { version = "0.29", optional = true }
open = { version = "5", optional = true }
tray-icon = { version = "0.19", optional = true }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
http = "1.3"
url = "2.5"
whoami = "1.6"
reed-solomon-erasure.workspace = true
cpal = { version = "0.15", optional = true }
serialport = { version = "4.7", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_Bluetooth",
    "Win32_Devices_Communication",
    "Win32_Networking_WinSock",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[build-dependencies]
winresource = "0.1"

[features]
default = ["desktop", "setup-probe"]
desktop = ["dep:eframe", "dep:open", "dep:tray-icon"]
setup-probe = ["dep:cpal", "dep:serialport"]

[dev-dependencies]
tempfile = "3.19"
tokio = { version = "1.44", features = ["full", "test-util"] }
reqwest = { workspace = true, features = ["json"] }
