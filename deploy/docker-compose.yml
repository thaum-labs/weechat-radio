services:
  hub:
    image: ghcr.io/thaum-labs/wcr:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["hub", "--bind", "0.0.0.0:7373"]
    volumes:
      - wcr-data:/data
    env_file:
      - ../.env
    environment:
      HOME: /data
    restart: unless-stopped
    expose:
      - "7373"

  path:
    image: ghcr.io/thaum-labs/wcr-path:latest
    build:
      context: ../services/path
      dockerfile: Dockerfile
    environment:
      WCR_PATH_BIND: 0.0.0.0:7380
    restart: unless-stopped
    expose:
      - "7380"

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../web:/srv/web:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - hub
      - path

volumes:
  wcr-data:
  caddy-data:
  caddy-config:
