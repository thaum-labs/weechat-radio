#cloud-config
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - git
  - ufw
runcmd:
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - mkdir -p /opt/wcr
  - git clone https://github.com/thaum-labs/weechat-radio.git /opt/wcr || true
  - cd /opt/wcr && docker compose -f deploy/docker-compose.yml up -d
