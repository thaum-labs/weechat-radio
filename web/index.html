<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WeeChat Radio — live map</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/styles.css?v=2" />
</head>
<body>
  <div id="scan"></div>
  <header>
    <div class="brand"><img src="/icon.png" alt="" width="28" height="28" />WEECHAT<span>RADIO</span></div>
    <nav>
      <a href="/" class="on">map</a>
      <a href="/downloads.html">downloads</a>
      <a href="/guides.html">guides</a>
      <a href="/docs.html">docs</a>
      <a href="/status.html">hub</a>
      <a href="/changelog.html">changelog</a>
    </nav>
    <div id="stats">nodes <b id="n-online">—</b> · tx/min <b id="n-tx">—</b></div>
  </header>
  <aside id="stations">
    <h2>stations</h2>
    <div id="station-list"></div>
  </aside>
  <div id="map"></div>
  <aside id="network">
    <h2>network</h2>
    <div id="hub-panel"></div>
    <div id="card" hidden></div>
  </aside>
  <footer>
    <div class="tape">
      <button type="button" id="play" aria-label="Play last 24 hours of traffic" aria-pressed="false">Play</button>
      <div class="tape-copy">
        <div class="tape-title">Last 24 hours of traffic</div>
        <div class="tape-hint" id="tape-clock">LIVE · drag to rewind, or press Play to replay the day</div>
      </div>
    </div>
    <div class="scrub-row">
      <span>24h ago</span>
      <input id="scrub" type="range" min="0" max="1440" value="1440" aria-valuemin="0" aria-valuemax="1440" aria-label="Traffic timeline, 24 hours ago to now" />
      <span>now</span>
    </div>
    <div id="ticker" aria-live="polite"></div>
  </footer>
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="/app.js?v=2"></script>
</body>
</html>
