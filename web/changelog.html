<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07070a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Changelog — WeeChat Radio</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css?v=11" />
</head>
<body class="page-doc">
  <div id="scan"></div>
  <div id="boot_screen" hidden><pre id="boot_log"></pre></div>
  <header class="topbar">
    <div class="prompt"><span class="who">weechat-radio</span><span class="sym">:$</span></div>
    <nav>
      <a href="/">map</a>
      <a href="/downloads.html">downloads</a>
      <a href="/guides.html">guides</a>
      <a href="/docs.html">docs</a>
      <a href="/status.html">hub</a>
      <a href="/changelog.html">changelog</a>
    </nav>
    <div class="clock-mod">
      <div id="clock-utc">UTC --:--:--</div>
      <div class="sub" id="clock-local">LCL --:--</div>
    </div>
  </header>
  <div class="page-wrap">
    <main class="page-panel">
      <h1><span class="who">weechat-radio</span><span class="sym">:$</span> changelog</h1>
      <div id="log">loading GitHub releases…</div>
    </main>
  </div>
  <script src="/shell.js?v=7"></script>
  <script>
    fetch("https://api.github.com/repos/thaum-labs/weechat-radio/releases")
      .then(r => r.json())
      .then(list => {
        if (!Array.isArray(list) || !list.length) {
          document.getElementById("log").textContent = "No tagged releases yet. Watch this space.";
          return;
        }
        document.getElementById("log").innerHTML = list.map(r =>
          `<article class="release"><h3 class="title"><p>${r.tag_name}</p><p>${new Date(r.published_at).toUTCString()}</p></h3><pre>${(r.body || "").replace(/[<>]/g, "")}</pre></article>`
        ).join("");
        if (window.WCR && window.WCR.wrapPres) window.WCR.wrapPres();
      })
      .catch(() => { document.getElementById("log").textContent = "Could not load releases."; });
  </script>
</body>
</html>
